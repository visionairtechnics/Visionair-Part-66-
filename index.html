<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verificador Part-66 AESA — VisionAir</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"/>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--surface3:#2d333b;
  --border:#30363d;--border2:#484f58;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --accent:#58a6ff;--gold:#f5a623;
  --ok:#3fb950;--ok-bg:rgba(63,185,80,.15);--ok-border:rgba(63,185,80,.4);
  --warn:#d29922;--warn-bg:rgba(210,153,34,.15);--warn-border:rgba(210,153,34,.4);
  --err:#f85149;--err-bg:rgba(248,81,73,.15);--err-border:rgba(248,81,73,.4);
  --info:#58a6ff;--info-bg:rgba(88,166,255,.12);--info-border:rgba(88,166,255,.3);
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);
  --radius:10px;
}
[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#f5f7fb;--surface3:#eef1f7;
  --border:#e0e6f0;--border2:#c8d4e8;
  --text:#1a1a2e;--text2:#4a5a7a;--text3:#8898aa;
  --accent:#1b2d5b;--gold:#e8960a;
  --ok:#1a7a30;--ok-bg:rgba(26,122,48,.1);--ok-border:rgba(26,122,48,.3);
  --warn:#7a5500;--warn-bg:rgba(122,85,0,.1);--warn-border:rgba(122,85,0,.3);
  --err:#b52b27;--err-bg:rgba(181,43,39,.1);--err-border:rgba(181,43,39,.3);
  --info:#1b2d5b;--info-bg:rgba(27,45,91,.1);--info-border:rgba(27,45,91,.25);
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 6px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;transition:background .2s,color .2s}
/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr img{height:34px;width:34px;object-fit:contain}
.hdr-brand{color:var(--text);font-size:13px;font-weight:700}
.hdr-sub{color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.hdr-right{display:flex;align-items:center;gap:6px}
.ico-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;transition:all .15s}
.ico-btn:hover{background:var(--surface3);color:var(--text)}
/* LAYOUT */
.wrap{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow)}
.card-sm{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700;border:1px solid}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.b-err{background:var(--err-bg);color:var(--err);border-color:var(--err-border)}
.b-info{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}
.b-grey{background:var(--surface2);color:var(--text2);border-color:var(--border)}
/* STATUS ICONS */
.si{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;border:1.5px solid}
.si-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.si-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.si-err{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.si-grey{background:var(--surface2);color:var(--text3);border-color:var(--border2)}
/* UPLOAD SCREEN */
.up-wrap{max-width:560px;margin:0 auto;padding:2rem 0}
.up-title{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.up-sub{font-size:14px;color:var(--text2);margin-bottom:2rem;line-height:1.6}
.step-label{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.sel-btn{padding:10px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface2);font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);width:100%;text-align:left;transition:all .12s;line-height:1.3;font-family:inherit}
.sel-btn:hover{border-color:var(--accent);color:var(--accent)}
.sel-btn.sel{background:var(--info-bg);border-color:var(--info-border);color:var(--info);font-weight:700}
.sel-btn.sel-ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.info-box{margin-top:8px;padding:9px 12px;background:var(--info-bg);border-radius:8px;font-size:12px;color:var(--info);border:1px solid var(--info-border)}
.dz{border:2px dashed var(--border2);border-radius:10px;padding:1.75rem;text-align:center;cursor:pointer;background:var(--surface2);transition:all .15s}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--info-bg)}
.dz-ico{font-size:26px;color:var(--text3);display:block;margin-bottom:9px}
.dz-t{font-weight:700;font-size:13px;margin-bottom:3px}
.dz-s{font-size:12px;color:var(--text3)}
.file-card{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface);border:1.5px solid var(--ok-border);border-radius:9px;margin-bottom:10px}
.file-ico{background:var(--ok-bg);border-radius:7px;padding:6px 8px;display:flex;font-size:17px;color:var(--ok);flex-shrink:0}
.btn-p{background:var(--accent);border:none;color:#fff;width:100%;padding:11px 20px;font-size:14px;font-weight:700;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;font-family:inherit;letter-spacing:-.01em}
.btn-p:hover:not(:disabled){opacity:.88}
.btn-p:disabled{opacity:.35;cursor:not-allowed}
.err-box{background:var(--err-bg);border:1px solid var(--err-border);border-radius:8px;padding:9px 13px;margin-bottom:10px;font-size:13px;color:var(--err);display:flex;align-items:center;gap:7px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
/* ANALYZING */
.an-wrap{padding:3rem 0;max-width:420px;margin:0 auto;text-align:center}
.an-circle{width:54px;height:54px;background:var(--info-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem}
.step-list{text-align:left;margin-top:1.25rem}
.step-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;border:1.5px solid}
/* REPORT */
/* Status banner */
.status-banner{padding:1rem 1.25rem;border-radius:var(--radius);border:1px solid;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px}
.sb-critico{background:var(--err-bg);border-color:var(--err-border)}
.sb-atencion{background:var(--warn-bg);border-color:var(--warn-border)}
.sb-conforme{background:var(--ok-bg);border-color:var(--ok-border)}
.sb-icon{font-size:22px}
.sb-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sb-sub{font-size:13px;color:var(--text2)}
/* Config block */
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border)}
.config-cell{background:var(--surface);padding:10px 14px}
.config-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:3px}
.config-val{font-size:13px;font-weight:700;color:var(--text)}
/* Verification summary */
.verif-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.verif-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.verif-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.verif-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.verif-ref{font-size:10px;color:var(--text3);margin-top:4px;font-family:monospace}
.verif-val{font-size:26px;font-weight:800;line-height:1;margin-bottom:2px}
.verif-sub{font-size:11px;color:var(--text2)}
/* Section */
.sec{margin-bottom:1.5rem}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title i{font-size:14px}
/* Months */
.months-wrap{display:flex;flex-wrap:wrap;gap:5px}
.mpill{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid;font-weight:600;cursor:default}
/* ATA */
.ata-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.ata-row:last-child{border-bottom:none}
.ata-code{font-size:11px;font-family:monospace;color:var(--text2);min-width:52px;flex-shrink:0}
.ata-bar{width:60px;height:5px;border-radius:99px;background:var(--surface3);overflow:hidden;flex-shrink:0}
.ata-fill{height:100%;border-radius:99px}
.ata-name{font-size:13px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ata-ct{font-size:11px;color:var(--text3);min-width:28px;text-align:right;flex-shrink:0}
/* OJT tokens */
.ojt-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.ojt-card{border-radius:8px;padding:10px 6px;text-align:center;border:1px solid}
.ojt-lbl{font-size:10px;font-weight:700;margin-bottom:2px}
.ojt-pct{font-size:19px;font-weight:800;line-height:1}
.ojt-min{font-size:9px;color:var(--text3);margin-top:1px}
.ojt-cnt{font-size:10px;font-weight:700;margin-top:2px}
/* Alerts */
.alert-row{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:8px;border:1px solid;margin-bottom:7px}
.alert-sev{flex-shrink:0;margin-top:1px}
.alert-ref{font-size:11px;font-family:monospace;color:var(--text3);margin-top:3px}
/* Entry table */
.etable{width:100%;border-collapse:collapse;font-size:12px}
.etable th{padding:9px 11px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);background:var(--surface2);border-bottom:2px solid var(--border);white-space:nowrap;font-weight:700}
.etable td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top}
.etable tr:last-child td{border-bottom:none}
.etable tr:nth-child(even) td{background:var(--surface2)}
/* Action plan */
.action-card{display:flex;gap:14px;padding:1rem 1.1rem;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px}
.action-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;margin-top:1px}
.action-body h4{font-size:14px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.action-desc{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:6px}
.action-entries{background:var(--surface3);border-radius:7px;padding:8px 10px;font-size:12px;color:var(--text2);margin-bottom:6px}
.action-how{background:var(--surface3);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:8px 10px;font-size:12px;color:var(--text2);line-height:1.6}
.action-ref{font-size:10px;font-family:monospace;color:var(--text3);margin-top:5px}
/* Summary */
.summary-box{padding:1rem 1.1rem;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:1.5rem}
/* Bars */
.bar-track{flex:1;background:var(--surface3);border-radius:99px;height:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s}
/* Buttons */
.btn-group{display:flex;gap:7px;flex-wrap:wrap}
.btn-out{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.btn-out:hover{border-color:var(--accent);color:var(--accent)}
/* Route box */
.route-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)}
/* Anim */
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .3s ease both}
/* Print */
@media print{
  .hdr .ico-btn,.btn-group,.no-print{display:none!important}
  body{background:#fff!important;color:#000!important}
  [data-theme]{--bg:#fff;--surface:#fff;--surface2:#f5f5f5;--surface3:#eee;--border:#ddd;--text:#000;--text2:#444;--text3:#888}
  .hdr{background:#1b2d5b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative}
  .card,.verif-card,.action-card,.alert-row{box-shadow:none}
}
@media(max-width:580px){.verif-grid{grid-template-columns:1fr 1fr}.ojt-grid{grid-template-columns:repeat(3,1fr)}.cat-grid{grid-template-columns:1fr}}
.review-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-top:1.5rem}
.review-panel h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.review-panel .sub{font-size:13px;color:var(--text2);margin-bottom:1rem}
.ctx-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ctx-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .12s}
.ctx-tag:hover{border-color:var(--accent);color:var(--accent);background:var(--info-bg)}
.ctx-tag i{font-size:13px}
textarea.ctx-input{width:100%;min-height:120px;padding:10px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:13px;line-height:1.6;resize:vertical;outline:none;transition:border-color .15s}
textarea.ctx-input:focus{border-color:var(--accent)}
textarea.ctx-input::placeholder{color:var(--text3)}
.reeval-btn{background:var(--accent);border:none;color:#fff;padding:10px 20px;font-size:13px;font-weight:700;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;transition:opacity .15s;margin-top:10px}
.reeval-btn:hover{opacity:.88}
.reeval-btn:disabled{opacity:.4;cursor:not-allowed}
.final-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:99px;font-weight:700;border:1px solid var(--ok-border);background:var(--ok-bg);color:var(--ok);margin-bottom:14px}
</style>
</head>

let savedTheme='dark';try{savedTheme=localStorage.getItem('theme')||'dark';}catch(e){}

themeBtn.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');

});

async function analyzeInTwoPhases(con){
  // Phase 1: Extract structured data
  let msgs1;
  const extractPrompt = buildExtractionPrompt();
  if(con.t==='pdf'){msgs1=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:con.d}},{type:'text',text:extractPrompt}]}];}
  else{msgs1=[{role:'user',content:extractPrompt+'\n\nDOCUMENTO:\n'+con.d.substring(0,35000)}];}
  
  const resp1=await fetch('/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:8000,system:'Eres un extractor de datos experto. Extrae datos exactos del documento sin interpretarlos. Solo JSON.',messages:msgs1})});
  const data1=await resp1.json();
  if(data1.error)throw new Error(data1.error.message);
  const txt1=data1.content?data1.content.map(i=>i.text||'').join(''):JSON.stringify(data1);
  const cleanTxt1=txt1.replace(/```json|```/g,'').trim();
  const match1=cleanTxt1.match(/\{[\s\S]*\}/);
  const extracted=JSON.parse(match1?match1[0]:cleanTxt1);
  
  return extracted;
}

async function analyze(){
  root().innerHTML=spinHTML(0);
  const tick=n=>new Promise(r=>setTimeout(()=>{root().innerHTML=spinHTML(n);r();},550));
  try{
    await tick(1);
    const con=await readFile(file);
    window._lastCon=con;
    window._lastExtracted=null;
    await tick(2);
    const prompt=buildPrompt();
    let msgs;
    if(con.t==='pdf'){
      msgs=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:con.d}},{type:'text',text:prompt}]}];
    } else {
      // For text files, send as much as possible
      msgs=[{role:'user',content:prompt+'\n\nDOCUMENTO COMPLETO:\n'+con.d.substring(0,55000)}];
    }
    await tick(3);
    await tick(4);
    const resp=await fetch('/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:8000,system:'Eres inspector experto LMA Parte 66 AESA. Responde en espanol con JSON valido unicamente.',messages:msgs})});
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    await tick(5);
    const rpt=data.content?JSON.parse(data.content.map(i=>i.text||'').join('')):data;
    window._lastRpt=rpt;
    window._lastExtracted={mesesDetalle:rpt.mesesDetalle,totalEntradas:rpt.experiencia?.totalEntradas};
    setTimeout(()=>showReport(rpt,false),400);
  }catch(e){file=null;render('Error al analizar: '+e.message);}
}

  return`<div class="an-wrap"><div class="an-circle"><i class="ti ti-loader-2" style="font-size:24px;color:var(--accent);animation:spin 1s linear infinite"></i></div>
<h2 style="font-size:18px;font-weight:800;margin:0 0 3px">Analizando registro...</h2>
<p style="font-size:12px;color:var(--text3);margin:0;font-family:monospace">${file?.name||''}</p>
<p style="font-size:12px;color:var(--text2);margin:0 0 0">${CATS[cat]?.label||''} · ${FORMACIONES[form]?.label||''}</p>
<div class="step-list">${PASOS.map((s,i)=>`<div class="step-row">
<div class="step-dot" style="background:${i<step?'var(--ok-bg)':i===step?'var(--info-bg)':'var(--surface2)'};border-color:${i<step?'var(--ok)':i===step?'var(--info)':'var(--border)'}">
${i<step?`<i class="ti ti-check" style="font-size:10px;color:var(--ok)"></i>`:i===step?`<i class="ti ti-loader-2" style="font-size:10px;color:var(--info);animation:spin 1s linear infinite"></i>`:`<span style="color:var(--text3)">${i+1}</span>`}

}

function siEl(ok,na=false){
  if(na)return`<div class="si si-grey"><i class="ti ti-minus" style="font-size:9px"></i></div>`;
  return ok===true?`<div class="si si-ok"><i class="ti ti-check" style="font-size:9px"></i></div>`:ok===false?`<div class="si si-err"><i class="ti ti-x" style="font-size:9px"></i></div>`:`<div class="si si-warn"><i class="ti ti-alert-triangle" style="font-size:9px"></i></div>`;
}

  file=f;render(null);
}

window.reEvaluar=async()=>{
  const ctx=document.getElementById('ctxInput')?.value?.trim();
  if(!ctx){alert('Por favor añade algún comentario o contexto antes de reevaluar.');return;}
  const btn=document.getElementById('reEvalBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i>Reevaluando...';}
  try{
    const con=window._lastCon;
    const prevRpt=window._lastRpt;
    if(!con)throw new Error('No hay documento en memoria. Por favor realiza el análisis de nuevo.');
    
    // Re-evaluation uses the already-extracted data (no re-reading document for counting)
    // Just re-evaluate with the context note added
    const extracted=window._lastExtracted;
    if(!extracted)throw new Error('Datos de extracción no disponibles. Realiza el análisis de nuevo.');
    const evalPrompt=buildEvaluationPrompt(extracted, ctx);
    const msgs=[{role:'user',content:evalPrompt}];
    const resp=await fetch('/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:6000,system:'Eres inspector experto LMA Parte 66 AESA. Los datos están pre-extraídos. El evaluador añade contexto que DEBES considerar. JSON válido únicamente.',messages:msgs})});
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    const rpt=data.content?JSON.parse(data.content.map(i=>i.text||'').join('')):data;
    window._lastRpt=rpt;
    showReport(rpt,true);
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh-alert"></i>Reevaluar con este contexto';}
    alert('Error al reevaluar: '+e.message);
  }
};
window.sForm=f=>{form=f;render(null);};
render(null);
</script>
</body>
</html>
