<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Analizador Experiencia Part-66 AESA — VisionAir</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#1a1a2e;font-size:15px;line-height:1.6;min-height:100vh;padding:0 1rem 2rem}
.wrap{max-width:700px;margin:0 auto}
/* Header brand */
.header{background:#1b2d5b;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;margin:0 -1rem 1.5rem;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.header img{height:44px;width:44px;object-fit:contain;flex-shrink:0}
.header-text p{margin:0;font-size:10px;color:#a8bfe0;letter-spacing:.06em;text-transform:uppercase}
.header-text h1{margin:0;font-size:16px;font-weight:700;color:#fff;line-height:1.2}
h2{font-size:18px;font-weight:700}
h3{font-size:14px;font-weight:700;color:#1a1a2e}
button{font-family:inherit;cursor:pointer;border:1px solid #ddd;background:#fff;color:#333;border-radius:8px;padding:8px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s}
button:hover{background:#f0f0f0}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:#1b2d5b;border-color:#1b2d5b;color:#fff;width:100%;justify-content:center;padding:12px 20px;font-size:14px;font-weight:700;border-radius:8px}
.btn-p:hover:not(:disabled){background:#14224a}
.btn-p:disabled{background:#cdd6e8;border-color:#cdd6e8;color:#888}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}
.card{background:#fff;border:1px solid #e0e6f0;border-radius:12px;padding:14px 16px}
.met{background:#eef1f7;border-radius:10px;padding:12px}
.cb{padding:10px 12px;border-radius:8px;border:1px solid #d0d8ea;background:#eef1f7;font-size:12px;font-weight:700;cursor:pointer;color:#4a5a7a;width:100%;text-align:left;transition:all .12s}
.cb.sel{background:#e8f0fe;border-color:#1b2d5b;color:#1b2d5b}
.bar-w{flex:1;background:#dde3ef;border-radius:99px;height:5px;overflow:hidden}
.dz{border:1.5px dashed #b0bdd4;border-radius:12px;padding:1.75rem;text-align:center;cursor:pointer;background:#f5f7fb;transition:all .15s}
.dz:hover,.dz.over{border-color:#1b2d5b;background:#e8f0fe}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f4f8}
.step:last-child{border-bottom:none}
.sc{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700}
.tok-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:8px}
.tok{border-radius:8px;padding:10px;text-align:center}
.pill{display:inline-block;font-size:10px;padding:2px 6px;border-radius:99px;font-weight:700;margin:1px}
.bok{background:#e6f4ea;color:#1e7e34}
.bwn{background:#fff3cd;color:#856404}
.ber{background:#fce8e6;color:#c5221f}
.bin{background:#e8f0fe;color:#1b2d5b}
.bgr{background:#eef1f7;color:#4a5a7a}
.bgo{background:#fff3e0;color:#e65100}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #eef1f7}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .3s ease both}
</style>
</head>

function buildPrompt(c){

  const matrix=ojtSheet.m;
  const matrixLines=matrix.map(t=>`ATA ${t.a} | ${t.d} | Tipos requeridos: ${t.r.join(', ')}`).join('\n');
  return `Eres un inspector experto en licencias LMA Parte 66 de AESA (España). Analiza el Registro de Experiencia Básica (LIC-P66-P01-F02) para categoría ${c} — ${cfg.label}.

TIPOS DE TAREA (OJT Task Selection):
INS=Inspección | FOT=Prueba funcional | SGH=Servicio/Ground handling | R/I=Desmontaje y montaje | MEL=Lista equipo mínimo | TS=Troubleshooting

RATIOS MÍNIMOS GLOBALES (sobre total tareas aplicables por tipo):
INS≥70% | FOT≥50% | SGH≥50% | R/I≥50% | MEL≥25% | TS≥25%

MATRIZ OJT — sub-capítulos ATA requeridos para ${c}:
${matrixLines}

REGLAS AESA:
1. MES VÁLIDO = mínimo 5 tareas ese mes, distribuidas a lo largo del mes (no todas el mismo día).

4. Para cada sub-capítulo ATA de la matriz, identifica qué tipos de tarea (INS/FOT/SGH/R-I/MEL/TS) han sido realizados.
5. RATIOS GLOBALES: calcula realizadas/requeridas por tipo y verifica que supera el mínimo.
6. FIRMAS: firma del Responsable de Mantenimiento o CC EN CADA PÁGINA (no en cada línea).
7. VIGENCIA: toda la experiencia dentro de los 10 años anteriores a la solicitud.

Clasifica cada tarea: verificación/check→INS | prueba funcional/test→FOT | servicio/lubricación/repostaje→SGH | desmontaje o montaje→R/I | aplicación MEL/CDL→MEL | localización/resolución avería→TS.

RESPONDE SOLO con JSON válido (sin markdown, sin backticks):
{"puntuacion":<0-100>,"estado":"conforme|atencion|critico","experiencia":{"mesesValidos":<n>,"mesesSin":${cfg.m.sin},"mesesRel":${cfg.m.rel},"mesesP147":${cfg.m.p147},"totalEntradas":<n>,"periodo":"<inicio> - <fin>","meses12":<n>,"meses7a":<n>,"recienteOk":<true|false>},"mesesDetalle":[{"mes":"Ene 2023","tareas":<n>,"ok":<true|false>}],"atas":[{"cod":"21-10","nombre":"<nombre>","entradas":<n>,"tipos_realizados":["INS","SGH"],"tipos_requeridos":["SGH","R/I","TS"],"estado":"ok|advertencia|critico|falta"}],"tiposTarea":{"INS":{"realizadas":<n>,"requeridas":<n>,"ratio":<0-1>,"ok":<bool>},"FOT":{"realizadas":<n>,"requeridas":<n>,"ratio":<0-1>,"ok":<bool>},"SGH":{"realizadas":<n>,"requeridas":<n>,"ratio":<0-1>,"ok":<bool>},"R/I":{"realizadas":<n>,"requeridas":<n>,"ratio":<0-1>,"ok":<bool>},"MEL":{"realizadas":<n>,"requeridas":<n>,"ratio":<0-1>,"ok":<bool>},"TS":{"realizadas":<n>,"requeridas":<n>,"ratio":<0-1>,"ok":<bool>}},"firmas":{"totalPaginas":<n>,"conFirma":<n>,"sinFirma":[<nums>]},"alertas":[{"ref":"<ref>","desc":"<desc>","sev":"critico|advertencia|info","reg":"<ref AESA/Parte66>"}],"acciones":[{"n":1,"tipo":"critico|importante|recomendado","titulo":"<titulo>","desc":"<desc>","ref":"<referencia>"}],"resumen":"<2-3 frases en español>"}`;

async function readFile(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='pdf'){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({t:'pdf',d:r.result.split(',')[1]});r.onerror=rej;r.readAsDataURL(f);});}
  if(['xlsx','xls','csv'].includes(ext)){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'binary'});let tx=`LIC-P66-P01-F02 — ${f.name}\n\n`;wb.SheetNames.forEach(n=>{tx+=`=== ${n} ===\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}\n\n`;});res({t:'text',d:tx});}catch(err){rej(err);}};r.onerror=rej;r.readAsBinaryString(f);});}
  if(['docx','doc'].includes(ext)){
    if(!window.mammoth){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
    return new Promise((res,rej)=>{const r=new FileReader();r.onload=async e=>{try{const out=await window.mammoth.extractRawText({arrayBuffer:e.target.result});res({t:'text',d:out.value});}catch(e2){rej(e2);}};r.onerror=rej;r.readAsArrayBuffer(f);});
  }
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res({t:'text',d:e.target.result});r.onerror=rej;r.readAsText(f);});
}

async function analyze(){
  root().innerHTML=spinHTML(0);
  const tick=n=>new Promise(r=>setTimeout(()=>{root().innerHTML=spinHTML(n);r();},550));
  try{
    await tick(1);const con=await readFile(file);
    await tick(2);await tick(3);
    const prompt=buildPrompt(cat);
    let msgs;
    if(con.t==='pdf'){msgs=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:con.d}},{type:'text',text:prompt}]}];}
    else{msgs=[{role:'user',content:`${prompt}\n\nDOCUMENTO:\n${con.d.substring(0,20000)}`}];}
    await tick(4);
    const resp=await fetch('/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:2000,system:'Eres inspector experto LMA Parte 66 AESA. Responde en español con JSON válido únicamente.',messages:msgs})});
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    const tx=data.content.map(i=>i.text||'').join('');
    await tick(5);
    if(!tx||tx.length<10){throw new Error('Respuesta vacía de la API. Intenta con un documento más pequeño.');}
    const clean=tx.replace(/```json|```/g,'').trim();
    const match=clean.match(/\{[\s\S]*\}/);
    if(!match){throw new Error('Formato de respuesta inesperado: '+tx.substring(0,100));}
    const rpt=JSON.parse(match[0]);
    setTimeout(()=>showReport(rpt),400);
  }catch(e){file=null;render('Error al analizar: '+e.message);}
}

  </div>
  ${file?`<div class="card fi" style="display:flex;align-items:center;gap:10px;border-color:#a8d5b2"><div style="background:#e6f4ea;border-radius:8px;padding:5px 7px;display:flex"><i class="ti ${imap[ext]||'ti-file'}" style="font-size:16px;color:#1e7e34"></i></div><div style="flex:1;min-width:0"><p style="margin:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${file.name}</p><p style="margin:0;font-size:11px;color:#888">${fs(file.size)}</p></div><i class="ti ti-circle-check" style="font-size:18px;color:#1e7e34"></i></div>`:''}
</div>

${err?`<div style="background:#fce8e6;border:1px solid #f5c2bd;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:13px;color:#c5221f;display:flex;align-items:center;gap:7px"><i class="ti ti-alert-circle"></i>${err}</div>`:''}

<button class="btn-p" id="ab" ${!canGo?'disabled':''}>
  <i class="ti ti-search"></i>
  ${!cat?'Selecciona una categoría':!file?'Sube el registro':'Analizar con requisitos AESA y matriz OJT'}
</button>

<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">${['AESA España','B1.1·B1.2·B1.3·B2','≥5 tareas/mes','OJT: INS/FOT/SGH/R-I/MEL/TS','Firmas por página'].map(t=>`<span class="tag bgr">${t}</span>`).join('')}</div>`;

  const dz=g('dz');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)setFile(f);});
  dz.addEventListener('click',()=>g('fi').click());
  g('fi').addEventListener('change',e=>{if(e.target.files[0])setFile(e.target.files[0]);});
  g('ab').addEventListener('click',()=>{if(canGo)analyze();});
}

window.sCat=c=>{cat=c;render(null);};
render(null);
</script>
</body>
</html>
