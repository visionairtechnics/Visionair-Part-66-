<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verificador Part-66 AESA — VisionAir</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"/>
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #f5f7fb;
  --border: #e0e6f0;
  --border2: #c8d4e8;
  --text: #1a1a2e;
  --text2: #4a5a7a;
  --text3: #8898aa;
  --accent: #1b2d5b;
  --accent-light: #e8f0fe;
  --accent-text: #1b2d5b;
  --gold: #f5a623;
  --ok: #1e7e34; --ok-bg: #e6f4ea; --ok-border: #a8d5b2;
  --warn: #856404; --warn-bg: #fff3cd; --warn-border: #ffc107;
  --err: #c5221f; --err-bg: #fce8e6; --err-border: #f5c2bd;
  --info: #1558d6; --info-bg: #e8f0fe; --info-border: #c8d8f8;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
}
[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --border2: #484f58;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #6e7681;
  --accent: #58a6ff;
  --accent-light: #1f2937;
  --accent-text: #58a6ff;
  --gold: #f5a623;
  --ok: #3fb950; --ok-bg: #1a3a1f; --ok-border: #238636;
  --warn: #d29922; --warn-bg: #2d2208; --warn-border: #9e6a03;
  --err: #f85149; --err-bg: #2d1117; --err-border: #da3633;
  --info: #58a6ff; --info-bg: #1f3a5f; --info-border: #1f6feb;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh;transition:background .2s,color .2s}
.header{background:var(--accent);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-md)}
.header-left{display:flex;align-items:center;gap:12px}
.header img{height:38px;width:38px;object-fit:contain}
.header-title{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.header-sub{color:rgba(255,255,255,.6);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{background:rgba(255,255,255,.12);border:none;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .15s;font-size:18px}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:780px;margin:0 auto;padding:1.5rem 1rem 3rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;box-shadow:var(--shadow)}
.card+.card{margin-top:1rem}
.section{margin-bottom:1.5rem}
.section-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.section-title i{color:var(--accent);font-size:16px}
.badge{display:inline-flex;align-items:center;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;gap:4px}
.badge-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.badge-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.badge-err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}
.badge-info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)}
.badge-grey{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;margin:1px}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-err{background:var(--err-bg);color:var(--err)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-grey{background:var(--surface2);color:var(--text3)}
/* Upload screen */
.upload-wrap{padding:2rem 0;max-width:560px;margin:0 auto}
.upload-title{font-size:26px;font-weight:700;margin-bottom:6px}
.upload-sub{font-size:14px;color:var(--text2);margin-bottom:2rem;line-height:1.6}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cat-btn{padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);width:100%;text-align:left;transition:all .12s;line-height:1.3}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.sel{background:var(--accent-light);border-color:var(--accent);color:var(--accent-text);font-weight:700}
.cat-info{margin-top:8px;padding:9px 12px;background:var(--accent-light);border-radius:8px;font-size:12px;color:var(--accent-text);border:1px solid var(--info-border)}
.dz{border:2px dashed var(--border2);border-radius:12px;padding:2rem 1.5rem;text-align:center;cursor:pointer;background:var(--surface2);transition:all .15s;margin-bottom:12px}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--accent-light)}
.dz-icon{font-size:28px;color:var(--text3);display:block;margin-bottom:10px}
.dz-title{font-weight:700;font-size:14px;margin-bottom:3px}
.dz-sub{font-size:12px;color:var(--text3)}
.file-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--ok-border);border-radius:10px;margin-bottom:12px}
.file-icon{background:var(--ok-bg);border-radius:8px;padding:6px 8px;display:flex;font-size:18px;color:var(--ok);flex-shrink:0}
.file-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--text3)}
.btn-primary{background:var(--accent);border:none;color:#fff;width:100%;padding:12px 20px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;font-family:inherit}
.btn-primary:hover:not(:disabled){opacity:.9}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.err-box{background:var(--err-bg);border:1px solid var(--err-border);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--err);display:flex;align-items:center;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
/* Analyzing screen */
.analyze-wrap{padding:3rem 0;max-width:440px;margin:0 auto;text-align:center}
.spin-circle{width:56px;height:56px;background:var(--accent-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.step-list{text-align:left;margin-top:1.5rem}
.step-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700}
/* Report screen */
.report-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem}
.score-big{font-size:48px;font-weight:800;line-height:1}
.report-meta{font-size:12px;color:var(--text2);font-family:monospace;margin-bottom:6px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem}
.metric-card{background:var(--surface2);border-radius:10px;padding:14px;border:1px solid var(--border)}
.metric-label{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.metric-val{font-size:24px;font-weight:800;line-height:1;margin-bottom:3px}
.metric-sub{font-size:11px;color:var(--text3)}
.bar-track{flex:1;background:var(--surface2);border-radius:99px;height:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s}
.months-grid{display:flex;flex-wrap:wrap;gap:5px}
.month-pill{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid;font-weight:500;cursor:default}
.ata-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.ata-row:last-child{border-bottom:none}
.ata-code{font-size:11px;font-family:monospace;color:var(--text2);min-width:48px;flex-shrink:0}
.ata-name{font-size:13px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ata-count{font-size:12px;color:var(--text3);min-width:28px;text-align:right}
.alert-card{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.alert-body p{margin:0;font-size:13px}
.alert-ref{font-size:11px;font-family:monospace;color:var(--text3);margin-top:3px}
.action-card{display:flex;gap:14px;padding:14px 16px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.action-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;margin-top:2px}
.action-body h4{font-size:14px;font-weight:700;margin-bottom:4px}
.action-body p{font-size:13px;color:var(--text2);line-height:1.6;margin:0}
.action-ref{font-size:11px;font-family:monospace;color:var(--text3);margin-top:5px}
.tok-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.tok-card{background:var(--surface2);border-radius:8px;padding:10px 6px;text-align:center;border:1px solid var(--border)}
.tok-label{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:3px}
.tok-pct{font-size:18px;font-weight:800;line-height:1}
.tok-min{font-size:9px;color:var(--text3)}
.tok-cnt{font-size:10px;font-weight:700;margin-top:2px}
.summary-box{padding:1rem 1.25rem;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:1.5rem}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn-outline{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .35s ease both}
/* Print */
@media print {
  .header .icon-btn, .btn-group, .no-print{display:none!important}
  body{background:#fff;color:#000}
  .header{position:relative;background:#1b2d5b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card,.metric-card,.alert-card,.action-card{box-shadow:none;border:1px solid #ddd}
  .months-grid .month-pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:600px){.tok-grid{grid-template-columns:repeat(3,1fr)}.metrics-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

async function readFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') return new Promise((res,rej) => {const r=new FileReader();r.onload=()=>res({t:'pdf',d:r.result.split(',')[1]});r.onerror=rej;r.readAsDataURL(f);});
  if (['xlsx','xls','csv'].includes(ext)) return new Promise((res,rej) => {const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'binary'});let tx=`LIC-P66-P01-F02 — ${f.name}\n\n`;wb.SheetNames.forEach(n=>{tx+=`=== ${n} ===\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}\n\n`;});res({t:'text',d:tx});}catch(err){rej(err);}};r.onerror=rej;r.readAsBinaryString(f);});
  if (['docx','doc'].includes(ext)) {
    if (!window.mammoth) await new Promise((res,rej) => {const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    return new Promise((res,rej) => {const r=new FileReader();r.onload=async e=>{try{const out=await window.mammoth.extractRawText({arrayBuffer:e.target.result});res({t:'text',d:out.value});}catch(e2){rej(e2);}};r.onerror=rej;r.readAsArrayBuffer(f);});
  }
  return new Promise((res,rej) => {const r=new FileReader();r.onload=e=>res({t:'text',d:e.target.result});r.onerror=rej;r.readAsText(f);});
}

async function analyze() {
  root().innerHTML = spinHTML(0);
  const tick = n => new Promise(r => setTimeout(() => {root().innerHTML = spinHTML(n); r();}, 550));
  try {
    await tick(1); const con = await readFile(file);
    await tick(2); await tick(3);
    const prompt = buildPrompt(cat);
    let msgs;
    if (con.t === 'pdf') msgs = [{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:con.d}},{type:'text',text:prompt}]}];
    else msgs = [{role:'user',content:`${prompt}\n\nDOCUMENTO:\n${con.d.substring(0,28000)}`}];
    await tick(4);
    const resp = await fetch('/analizar', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:8000,system:'Eres inspector experto LMA Parte 66 AESA. Responde en español con JSON válido únicamente.',messages:msgs})});
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    await tick(5);
    const rpt = data.content ? JSON.parse(data.content.map(i=>i.text||'').join('')) : data;
    setTimeout(() => showReport(rpt), 400);
  } catch(e) {
    file = null; render('Error al analizar: ' + e.message);
  }
}

    <span style="font-size:13px;font-weight:700;min-width:65px;text-align:right;color:${col(100,60,0,pct)}">${mv}/${req} m</span>
  </div>`).join('')}
  ${exp.recienteOk === false ? `<div class="err-box" style="margin-top:8px"><i class="ti ti-alert-circle"></i>Experiencia reciente insuficiente: se requieren ≥6 meses en últimos 12 meses</div>` : ''}
</div>

${mes.length ? `<div class="section">
  <div class="section-title"><i class="ti ti-calendar-stats"></i>Meses del registro <span style="font-size:12px;color:var(--text3);font-weight:400">verde = ≥5 tareas</span></div>
  <div class="months-grid">${mes.map(m=>`<span class="month-pill" style="background:${m.ok?'var(--ok-bg)':'var(--surface2)'};color:${m.ok?'var(--ok)':'var(--text3)'};border-color:${m.ok?'var(--ok-border)':'var(--border)'}" title="${m.tareas} tareas">${m.mes}</span>`).join('')}</div>
</div>` : ''}

${Object.keys(tt).length ? `<div class="section">
  <div class="section-title"><i class="ti ti-adjustments"></i>Tipos de tarea OJT — ratios globales</div>
  <div class="tok-grid">${TIPOS.map(t=>{const d=tt[t]||{};const pct=d.ratio!=null?Math.round(d.ratio*100):0;const min=Math.round((TIPO_MIN[t]||0)*100);const ok=d.ok!==undefined?d.ok:pct>=min;const c=ok?'var(--ok)':pct>=min*.7?'var(--warn)':'var(--err)';const bg=ok?'var(--ok-bg)':pct>=min*.7?'var(--warn-bg)':'var(--err-bg)';return`<div class="tok-card" style="background:${bg};border-color:${ok?'var(--ok-border)':pct>=min*.7?'var(--warn-border)':'var(--err-border)'}"><div class="tok-label">${t}</div><div class="tok-pct" style="color:${c}">${pct}%</div><div class="tok-min" style="color:var(--text3)">mín.${min}%</div><div class="tok-cnt" style="color:${c}">${d.realizadas??'?'}/${d.requeridas??'?'}</div></div>`;}).join('')}</div>
  <p style="font-size:11px;color:var(--text3);margin-top:4px">${TIPOS.map(t=>`${t}=${TIPO_LABELS[t]}`).join(' · ')}</p>
</div>` : ''}

${atas.length ? `<div class="section">
  <div class="section-title"><i class="ti ti-sitemap"></i>Cobertura ATA · ${cat}</div>
  <div class="card" style="padding:0;overflow:hidden">
    ${atas.map(a=>`<div class="ata-row" style="padding:10px 14px">
      <span class="ata-code">ATA ${a.cod}</span>
      <div class="bar-track" style="max-width:80px;flex:none"><div class="bar-fill" style="width:${ataBarPct(a.estado)}%;background:${ataColor(a.estado)}"></div></div>
      <span class="ata-name">${a.nombre||''}</span>
      <span class="ata-count">${a.entradas??0}t</span>
      <i class="ti ${ataIcon(a.estado)}" style="font-size:14px;color:${ataColor(a.estado)};flex-shrink:0"></i>
    </div>`).join('')}
  </div>
</div>` : ''}

${alertas.length ? `<div class="section">
  <div class="section-title"><i class="ti ti-alert-triangle"></i>Alertas <span class="badge badge-err" style="margin-left:4px">${alertas.filter(a=>a.sev==='critico').length} críticas</span></div>
  ${alertas.map(a=>{const sm=svMeta(a.sev);return`<div class="alert-card">
    <span class="badge ${sm.cls}" style="flex-shrink:0;margin-top:1px">${sm.label}</span>
    <div class="alert-body"><p><strong>${a.ref}</strong> — ${a.desc}</p>${a.reg?`<p class="alert-ref">${a.reg}</p>`:''}</div>
  </div>`;}).join('')}
</div>` : ''}

${plan.length ? `<div class="section">
  <div class="section-title"><i class="ti ti-checklist"></i>Plan de acción</div>
  ${plan.map(a=>{const am=acMeta(a.tipo);return`<div class="action-card">
    <div class="action-num" style="background:${am.numBg};color:${am.numCol}">0${a.n}</div>
    <div class="action-body" style="flex:1">
      <h4>${a.titulo} <span class="badge ${am.cls}" style="font-size:10px">${am.label}</span></h4>
      <p>${a.desc}</p>
      ${a.ref?`<p class="action-ref">${a.ref}</p>`:''}
    </div>
  </div>`;}).join('')}
</div>` : ''}

</div>`;
}

function setFile(f) {
  const ok = ['pdf','docx','doc','xlsx','xls','csv'];
  if (!ok.includes(f.name.split('.').pop().toLowerCase())) { render('Formato no soportado. Usa PDF, Word o Excel.'); return; }
  file = f; render(null);
}

function render(err) {
  const ext = file?.name.split('.').pop().toUpperCase() || '';
  const imap = {PDF:'ti-file-type-pdf',XLSX:'ti-file-spreadsheet',XLS:'ti-file-spreadsheet',CSV:'ti-file-spreadsheet',DOCX:'ti-file-word',DOC:'ti-file-word'};
  const canGo = !!(file && cat);
  root().innerHTML = `<div class="upload-wrap">
<h1 class="upload-title">Registro de Experiencia Básica</h1>
<p class="upload-sub">Sube el LIC-P66-P01-F02 y selecciona la categoría para verificar el cumplimiento según los requisitos de AESA, incluyendo la matriz OJT de tipos de tarea.</p>

<div style="margin-bottom:1.25rem">
  <p style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)">1. Selecciona la categoría</p>
  <div class="cat-grid">${Object.entries(CATS).map(([k,v])=>`<button class="cat-btn${cat===k?' sel':''}" onclick="window.sCat('${k}')">${v.label}</button>`).join('')}</div>
  ${cat ? `<div class="cat-info"><i class="ti ti-info-circle" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>${CATS[cat].nota}</div>` : ''}
</div>

<div style="margin-bottom:1.25rem">
  <p style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)">2. Sube el registro de experiencia</p>
  <div id="dz" class="dz" style="${file?'margin-bottom:10px':''}">
    <input type="file" id="fi" accept=".pdf,.docx,.doc,.xlsx,.xls,.csv" style="display:none">
    <i class="ti ti-upload dz-icon"></i>
    <p class="dz-title">Arrastra el LIC-P66-P01-F02 aquí</p>
    <p class="dz-sub">PDF · Word (.docx) · Excel (.xlsx, .csv)</p>
  </div>
  ${file ? `<div class="file-card"><div class="file-icon"><i class="ti ${imap[ext]||'ti-file'}"></i></div><div style="flex:1;min-width:0"><div class="file-name">${file.name}</div><div class="file-size">${fs(file.size)}</div></div><i class="ti ti-circle-check" style="font-size:18px;color:var(--ok)"></i></div>` : ''}
</div>

${err ? `<div class="err-box"><i class="ti ti-alert-circle"></i>${err}</div>` : ''}

<button class="btn-primary" id="ab" ${!canGo?'disabled':''}><i class="ti ti-search"></i>${!cat?'Selecciona una categoría':!file?'Sube el registro':'Analizar con requisitos AESA y OJT'}</button>

<div class="tags">${['AESA España','B1.1·B1.2·B1.3·B2','≥5 tareas/mes','OJT: INS/FOT/SGH/R-I/MEL/TS','Firmas por página'].map(t=>`<span class="badge badge-grey">${t}</span>`).join('')}</div>
</div>`;

  const dz = g('dz');
  if (dz) {
    dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('over');});
    dz.addEventListener('dragleave', ()=>dz.classList.remove('over'));
    dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)setFile(f);});
    dz.addEventListener('click', ()=>g('fi').click());
    g('fi').addEventListener('change', e=>{if(e.target.files[0])setFile(e.target.files[0]);});
  }
  const ab = g('ab');
  if (ab) ab.addEventListener('click', ()=>{if(canGo)analyze();});
}

window.sCat = c => {cat=c; render(null);};
render(null);
</script>
</body>
</html>
